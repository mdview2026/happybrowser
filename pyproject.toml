[project]
name = "happybrowser"
version = "0.1.0"
description = "精简浏览器自动化库：仅 Chromium，仅 ? / Q 查询语法，内嵌改造自 DrissionPage 的 CDP 驱动"
readme = "README.md"
# 许可为继承自 DrissionPage 的自定义条款（个人学习/合法非盈利，商用需授权），
# 非 OSI 标准许可证，故用 LicenseRef 表达，全文见 LICENSE 文件
license = "LicenseRef-DrissionPage-Inherited"
requires-python = ">=3.9"
keywords = ["browser-automation", "chromium", "cdp", "xpath", "web-scraping"]
urls = { Homepage = "https://github.com/mdview2026/happybrowser", Documentation = "https://github.com/mdview2026/happybrowser/blob/main/docs/migration.md" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "websocket-client>=1.6",
    "requests>=2.28",
]

[project.scripts]
hb = "happybrowser.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "lxml>=4.9",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/happybrowser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 忽略项均为刻意保留的 fork 风格（见 docs/design.md「风格基线」）：
# UP009 utf-8 编码声明文件头（版权标识 + Windows cp936 终端下真实有用）
# UP004 class X(object) py2 遗留写法 / I001 导入顺序 —— 大面积重排无收益
# BLE001/S110/S112/TRY004 宽泛 except 与静默容错 —— fork 的容错策略原样继承
# RUF012 可变类默认值 —— listener/setter 挂件的 _xxx = None 占位写法
# UP031 % 格式化（JS 模板拼接）/ SIM210/SIM211/SIM102/RUF059/C401/RUF015/
# PIE810/TRY201 —— fork 原文的等价风格写法，改写无收益
ignore = [
    "UP009", "UP004", "I001",
    "BLE001", "S110", "S112", "TRY004",
    "RUF012",
    "UP031", "SIM210", "SIM211", "SIM102", "RUF059", "C401", "RUF015", "PIE810", "TRY201",
]
